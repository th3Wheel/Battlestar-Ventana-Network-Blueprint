[project]
name = "battlestar-ansible-controller"
version = "0.1.0"
description = "Isolated Linux/WSL development controller; not the legacy deployment execution environment"
requires-python = ">=3.14,<3.15"
dependencies = [
    "ansible-core==2.21.3",
    "ansible-dev-tools==26.8.0",
    "docker>=6.1,<8",
    "proxmoxer>=2.0,<3",
    "pytest-ansible==26.8.0",
    "requests>=2.31,<3",
]

[tool.uv]
package = false
environments = ["sys_platform == 'linux'"]
