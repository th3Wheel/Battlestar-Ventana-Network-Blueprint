---
# openwrt_docker_eval role
# Implements the OpenWrt-in-Docker evaluation tasks from plans/infrastructure-router-vlans-2.md
# VLAN data consumed from group_vars/all/vlan-vars.yml (source of truth)

- name: 'Research — document OpenWrt Docker capabilities'
  ansible.builtin.include_tasks: research.yml
  when: openwrt_docker_eval_task == 'research'

- name: 'Provision — launch OpenWrt container with VLAN 20 and 40 bridges'
  ansible.builtin.include_tasks: provision.yml
  when: openwrt_docker_eval_task == 'provision'

- name: 'Full matrix — validate all 11 VLANs in OpenWrt container'
  ansible.builtin.include_tasks: full_matrix.yml
  when: openwrt_docker_eval_task == 'full_matrix'

- name: 'Generate config — emit docker-compose.yml and UCI backups'
  ansible.builtin.include_tasks: generate_config.yml
  when: openwrt_docker_eval_task == 'generate_config'
