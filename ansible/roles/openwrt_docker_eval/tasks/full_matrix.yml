---
- name: Create Docker VLAN bridge networks for all blueprint VLANs
  community.docker.docker_network:
    name: 'vlan{{ item.id }}-bridge'
    driver: macvlan
    driver_options:
      parent: "{{ openwrt_parent_iface | default('eth0') }}.{{ item.id }}"
    ipam_config:
      - subnet: '{{ item.subnet }}'
        gateway: '{{ item.gateway }}'
    state: present
  loop: '{{ vlans }}'
  loop_control:
    label: 'VLAN {{ item.id }} — {{ item.name }}'
  become: true
  register: openwrt_docker_eval_vlan_networks
  # Best-effort: a VLAN network that cannot be created must not abort the
  # evaluation; the container exec checks below record what actually exists.
  failed_when: false

- name: Execute VLAN interface check inside OpenWrt container
  community.docker.docker_container_exec:
    container: openwrt-eval
    command: 'ip -d link show'
  register: openwrt_docker_eval_links
  changed_when: false

- name: Append full-matrix results to research file
  ansible.builtin.lineinfile:
    path: '{{ openwrt_docker_eval_research_output_dir }}/openwrt-docker-capabilities.md'
    line: "- Full-matrix VLAN validation completed: {{ now().strftime('%Y-%m-%d') }}"
    create: true
    mode: '0644'
  delegate_to: localhost
