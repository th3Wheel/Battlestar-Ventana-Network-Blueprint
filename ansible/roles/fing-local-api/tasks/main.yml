- name: Validate Fing Local API configuration
  ansible.builtin.assert:
    that:
      - network_discovery is defined and network_discovery is mapping
      - network_discovery is defined and network_discovery.fing_local_api is defined and network_discovery.fing_local_api is mapping
      - network_discovery is defined and network_discovery.fing_local_api is defined and (not (network_discovery.fing_local_api.enabled | bool) or ((network_discovery.fing_local_api.api_key | default('') | string | length) > 0))
      - network_discovery is defined and network_discovery.fing_local_api is defined and (not (network_discovery.fing_local_api.enabled | bool) or ((network_discovery.fing_local_api.base_url | default('') | string | length) > 0))
      - network_discovery is defined and network_discovery.fing_local_api is defined and (not (network_discovery.fing_local_api.enabled | bool) or ((network_discovery.fing_local_api.devices_endpoint | default('') | string | length) > 0))
      - network_discovery is defined and network_discovery.fing_local_api is defined and (not (network_discovery.fing_local_api.enabled | bool) or ((network_discovery.fing_local_api.people_endpoint | default('') | string | length) > 0))
      - network_discovery is defined and network_discovery.fing_local_api is defined and (not (network_discovery.fing_local_api.enabled | bool) or (((network_discovery.fing_local_api.auth_query_param | default('') | string | length) > 0) and (network_discovery.fing_local_api.timeout_seconds is defined) and ((network_discovery.fing_local_api.timeout_seconds | int) > 0)))
    fail_msg: >-
      Fing Local API integration is enabled but required settings are missing.
      Confirm network_discovery.fing_local_api.* values and set a non-empty API key in vault/CI variables.
    success_msg: Fing Local API configuration is valid

- name: Fetch Fing Local API devices
  ansible.builtin.uri:
    url: "{{ network_discovery.fing_local_api.base_url }}{{ network_discovery.fing_local_api.devices_endpoint }}?{{ network_discovery.fing_local_api.auth_query_param }}={{ network_discovery.fing_local_api.api_key | urlencode }}"
    method: GET
    status_code: 200
    return_content: true
    timeout: "{{ network_discovery.fing_local_api.timeout_seconds }}"
  register: fing_devices_response
  no_log: true
  when: network_discovery.fing_local_api.enabled | bool

- name: Fetch Fing Local API people
  ansible.builtin.uri:
    url: "{{ network_discovery.fing_local_api.base_url }}{{ network_discovery.fing_local_api.people_endpoint }}?{{ network_discovery.fing_local_api.auth_query_param }}={{ network_discovery.fing_local_api.api_key | urlencode }}"
    method: GET
    status_code: 200
    return_content: true
    timeout: "{{ network_discovery.fing_local_api.timeout_seconds }}"
  register: fing_people_response
  no_log: true
  when: network_discovery.fing_local_api.enabled | bool

- name: Report Fing Local API fetch status
  ansible.builtin.debug:
    msg:
      devices_status: "{{ fing_devices_response.status | default('skipped') }}"
      people_status: "{{ fing_people_response.status | default('skipped') }}"
  when: network_discovery.fing_local_api.enabled | bool