---
# dotfiles-prereqs role
# Installs fzf, zoxide, and starship on the target workstation

- name: Install fzf via apt
  ansible.builtin.package:
    name: fzf
    state: present
  become: true
  when: ansible_pkg_mgr == 'apt'

- name: Install fzf via pacman
  ansible.builtin.package:
    name: fzf
    state: present
  become: true
  when: ansible_pkg_mgr == 'pacman'

- name: Install fzf via dnf
  ansible.builtin.package:
    name: fzf
    state: present
  become: true
  when: ansible_pkg_mgr == 'dnf'

- name: Install zoxide via apt
  ansible.builtin.package:
    name: zoxide
    state: present
  become: true
  when: ansible_pkg_mgr == 'apt'

- name: Install zoxide via pacman
  ansible.builtin.package:
    name: zoxide
    state: present
  become: true
  when: ansible_pkg_mgr == 'pacman'

- name: Install zoxide via dnf
  ansible.builtin.package:
    name: zoxide
    state: present
  become: true
  when: ansible_pkg_mgr == 'dnf'

- name: Install starship via pacman
  ansible.builtin.package:
    name: starship
    state: present
  become: true
  when: ansible_pkg_mgr == 'pacman'

- name: Install starship via dnf
  ansible.builtin.package:
    name: starship
    state: present
  become: true
  when: ansible_pkg_mgr == 'dnf'
