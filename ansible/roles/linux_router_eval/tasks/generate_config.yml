---
- name: Create prototype output directory
  ansible.builtin.file:
    path: '{{ playbook_dir }}/../../projects/route-pi-squared/infrastructure/linux-router/prototypes'
    state: directory
    mode: '0755'
  delegate_to: localhost

- name: Copy lnxrouter VLAN launcher script
  ansible.builtin.copy:
    src: lnxrouter-vlan.sh
    dest: '{{ playbook_dir }}/../../projects/route-pi-squared/infrastructure/linux-router/prototypes/lnxrouter-vlan.sh'
    mode: '0755'
  delegate_to: localhost

- name: Generate per-VLAN lnxrouter config
  ansible.builtin.template:
    src: vlan.env.j2
    dest: '{{ playbook_dir }}/../../projects/route-pi-squared/infrastructure/linux-router/prototypes/vlan-{{ item.id }}-{{ item.name | lower }}.env'
    mode: '0644'
  loop: '{{ vlans }}'
  loop_control:
    label: 'VLAN {{ item.id }}'
  delegate_to: localhost
