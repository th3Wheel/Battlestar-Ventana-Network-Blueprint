---
# linux_router_eval role
# Implements the linux-router evaluation tasks from plans/infrastructure-router-vlans-2.md
# VLAN data consumed from group_vars/all/vlan-vars.yml (source of truth)

- name: 'Research — clone linux-router upstream repository'
  when: linux_router_eval_task == 'research'
  block:
    # Runs on the controller. Install git only when it is missing, so a controller that already has it (the
    # execution environment image does, and runs as an unprivileged user with no sudo) never needs privilege escalation.
    - name: Check whether git is available
      ansible.builtin.command:
        cmd: git --version
      register: linux_router_eval_git_check
      changed_when: false
      failed_when: false

    - name: Ensure git is present
      ansible.builtin.package:
        name: git
        state: present
      become: true
      when: linux_router_eval_git_check.rc != 0

    - name: Clone linux-router repository
      ansible.builtin.git:
        repo: 'https://github.com/garywill/linux-router.git'
        dest: '/tmp/linux-router-src'
        version: master
        depth: 1

    - name: Capture linux-router README for capability extraction
      ansible.builtin.slurp:
        src: '/tmp/linux-router-src/README.md'
      register: linux_router_eval_readme

    - name: Create research output directory
      ansible.builtin.file:
        path: '{{ linux_router_eval_research_output_dir }}'
        state: directory
        mode: '0755'
      delegate_to: localhost

    - name: Write capabilities research file stub
      ansible.builtin.copy:
        dest: '{{ linux_router_eval_research_output_dir }}/linux-router-capabilities.md'
        mode: '0644'
        content: |
          # linux-router Capabilities Research

          **Source:** https://github.com/garywill/linux-router
          **Extracted by:** ansible/roles/linux_router_eval (research task)

          ## Feature Summary

          {{ linux_router_eval_readme.content | b64decode | truncate(2000) }}

          ## Evaluation Results

          _To be populated during TASK-002 and TASK-003._
      delegate_to: localhost
  rescue:
    - name: Report which phase failed
      ansible.builtin.fail:
        msg: >-
          linux_router_eval: phase '{{ linux_router_eval_task }}' failed at task
          '{{ ansible_failed_task.name | default('unknown') }}':
          {{ ansible_failed_result.msg | default('see the task output above') }}

- name: 'Provision — install and configure linux-router on lab node'
  when: linux_router_eval_task == 'provision'
  block:
    - name: Ensure required packages are present
      ansible.builtin.package:
        name:
          - iproute2
          - dnsmasq
          - iptables
          - bridge-utils
          - dnsutils
        state: present
      become: true

    - name: Download pinned lnxrouter script from reviewed upstream revision
      vars:
        linux_router_eval_commit: '445fadba86a196223fcabd150e0e66eae963c08f'
        linux_router_eval_sha256: 'e242101d418296c2a88c6da7c22dc306791242a19ab90939329c946bde7bae1e'
      ansible.builtin.get_url:
        url: 'https://raw.githubusercontent.com/garywill/linux-router/{{ linux_router_eval_commit }}/lnxrouter'
        dest: '/usr/local/bin/lnxrouter'
        checksum: 'sha256:{{ linux_router_eval_sha256 }}'
        mode: '0755'
      become: true

    - name: Create VLAN interfaces for evaluation VLANs (20 and 40)
      ansible.builtin.command:
        cmd: 'ip link add link {{ linux_router_eval_lan_interface }} name {{ linux_router_eval_lan_interface }}.{{ item.id }} type vlan id {{ item.id }}'
      loop: "{{ vlans | selectattr('id', 'in', [20, 40]) | list }}"
      loop_control:
        label: 'VLAN {{ item.id }} — {{ item.name }}'
      become: true
      register: linux_router_eval_vlan_add
      changed_when: linux_router_eval_vlan_add.rc == 0
      # Re-runs find the interface already present; any other failure is real.
      failed_when: linux_router_eval_vlan_add.rc != 0 and 'File exists' not in linux_router_eval_vlan_add.stderr

    - name: Bring VLAN interfaces up
      ansible.builtin.command:
        cmd: 'ip link set {{ linux_router_eval_lan_interface }}.{{ item.id }} up'
      loop: "{{ vlans | selectattr('id', 'in', [20, 40]) | list }}"
      loop_control:
        label: 'VLAN {{ item.id }}'
      become: true
      changed_when: false

    - name: Assign gateway addresses to VLAN interfaces
      ansible.builtin.command:
        cmd: 'ip addr add {{ item.gateway }}/24 dev {{ linux_router_eval_lan_interface }}.{{ item.id }}'
      loop: "{{ vlans | selectattr('id', 'in', [20, 40]) | list }}"
      loop_control:
        label: 'VLAN {{ item.id }} — {{ item.gateway }}'
      become: true
      register: linux_router_eval_gateway_add
      changed_when: linux_router_eval_gateway_add.rc == 0
      failed_when: linux_router_eval_gateway_add.rc != 0 and 'File exists' not in linux_router_eval_gateway_add.stderr
  rescue:
    - name: Report which phase failed
      ansible.builtin.fail:
        msg: >-
          linux_router_eval: phase '{{ linux_router_eval_task }}' failed at task
          '{{ ansible_failed_task.name | default('unknown') }}':
          {{ ansible_failed_result.msg | default('see the task output above') }}

- name: 'Validate — check NAT, DHCP option 6, and Pi-hole reachability'
  when: linux_router_eval_task == 'validate'
  block:
    - name: Verify VLAN interfaces exist
      ansible.builtin.command:
        cmd: 'ip -d link show {{ linux_router_eval_lan_interface }}.{{ item.id }}'
      loop: "{{ vlans | selectattr('id', 'in', [20, 40]) | list }}"
      loop_control:
        label: 'VLAN {{ item.id }}'
      register: linux_router_eval_vlan_link_check
      changed_when: false
      become: true

    - name: Test DNS reachability to Pi-hole primary
      ansible.builtin.command:
        cmd: 'dig +short +timeout=5 example.com @{{ pihole_primary_vip }}'
      register: linux_router_eval_dns_check
      changed_when: false
      failed_when: linux_router_eval_dns_check.rc != 0

    - name: Log validation results to research file
      ansible.builtin.lineinfile:
        path: '{{ linux_router_eval_research_output_dir }}/linux-router-capabilities.md'
        line: "- VLAN {{ item.item.id }} interface check: {{ 'PASS' if item.rc == 0 else 'FAIL' }} ({{ now(fmt='%Y-%m-%d') }})"
        create: true
        mode: '0644'
      loop: '{{ linux_router_eval_vlan_link_check.results }}'
      loop_control:
        label: 'VLAN {{ item.item.id }}'
      delegate_to: localhost
  rescue:
    - name: Report which phase failed
      ansible.builtin.fail:
        msg: >-
          linux_router_eval: phase '{{ linux_router_eval_task }}' failed at task
          '{{ ansible_failed_task.name | default('unknown') }}':
          {{ ansible_failed_result.msg | default('see the task output above') }}

- name: 'Full matrix — validate all 11 VLANs'
  when: linux_router_eval_task == 'full_matrix'
  block:
    - name: Create VLAN interface for each blueprint VLAN
      ansible.builtin.command:
        cmd: 'ip link add link {{ linux_router_eval_lan_interface }} name {{ linux_router_eval_lan_interface }}.{{ item.id }} type vlan id {{ item.id }}'
      loop: '{{ vlans }}'
      loop_control:
        label: 'VLAN {{ item.id }} — {{ item.name }}'
      become: true
      register: linux_router_eval_full_matrix_vlan_add
      changed_when: linux_router_eval_full_matrix_vlan_add.rc == 0
      failed_when: linux_router_eval_full_matrix_vlan_add.rc != 0 and 'File exists' not in linux_router_eval_full_matrix_vlan_add.stderr

    - name: Verify VLAN interface presence for all 11 VLANs
      ansible.builtin.command:
        cmd: 'ip -d link show {{ linux_router_eval_lan_interface }}.{{ item.id }}'
      loop: '{{ vlans }}'
      loop_control:
        label: 'VLAN {{ item.id }}'
      register: linux_router_eval_full_matrix_check
      changed_when: false
      become: true
      failed_when: >-
        linux_router_eval_full_matrix_check.rc != 0 and
        'Cannot find device' not in (linux_router_eval_full_matrix_check.stderr | default('')) and
        'does not exist' not in (linux_router_eval_full_matrix_check.stderr | default(''))

    - name: Append full-matrix results to research file
      ansible.builtin.lineinfile:
        path: '{{ linux_router_eval_research_output_dir }}/linux-router-capabilities.md'
        line: "- VLAN {{ item.item.id }} ({{ item.item.name }}) full-matrix: {{ 'PASS' if item.rc == 0 else 'FAIL' }} | tested: true | date: {{ now(fmt='%Y-%m-%d') }}"
        create: true
        mode: '0644'
      loop: '{{ linux_router_eval_full_matrix_check.results }}'
      loop_control:
        label: 'VLAN {{ item.item.id }}'
      delegate_to: localhost
  rescue:
    - name: Report which phase failed
      ansible.builtin.fail:
        msg: >-
          linux_router_eval: phase '{{ linux_router_eval_task }}' failed at task
          '{{ ansible_failed_task.name | default('unknown') }}':
          {{ ansible_failed_result.msg | default('see the task output above') }}

- name: 'Generate config — emit prototype scripts for all VLANs'
  when: linux_router_eval_task == 'generate_config'
  block:
    - name: Create prototype output directory
      ansible.builtin.file:
        path: '{{ playbook_dir }}/../../projects/route-pi-squared/infrastructure/linux-router/prototypes'
        state: directory
        mode: '0755'
      delegate_to: localhost

    - name: Copy lnxrouter VLAN launcher script
      ansible.builtin.copy:
        src: lnxrouter-vlan.sh
        dest: '{{ playbook_dir }}/../../projects/route-pi-squared/infrastructure/linux-router/prototypes/lnxrouter-vlan.sh'
        mode: '0755'
      delegate_to: localhost

    - name: Generate per-VLAN lnxrouter config
      ansible.builtin.template:
        src: vlan.env.j2
        dest: '{{ playbook_dir }}/../../projects/route-pi-squared/infrastructure/linux-router/prototypes/vlan-{{ item.id }}-{{ item.name | lower }}.env'
        mode: '0644'
      loop: '{{ vlans }}'
      loop_control:
        label: 'VLAN {{ item.id }}'
      delegate_to: localhost

    - name: Find generated files from earlier runs
      ansible.builtin.find:
        paths: '{{ playbook_dir }}/../../projects/route-pi-squared/infrastructure/linux-router/prototypes'
        patterns: 'vlan-*.sh,vlan-*.env'
      register: linux_router_eval_generated_files
      delegate_to: localhost

    - name: Remove per-VLAN scripts and config files this run did not generate
      ansible.builtin.file:
        path: '{{ item.path }}'
        state: absent
      vars:
        linux_router_eval_expected_names: >-
          {% for vlan in vlans %}vlan-{{ vlan.id }}-{{ vlan.name | lower }}.env
          {% endfor %}
      loop: '{{ linux_router_eval_generated_files.files }}'
      loop_control:
        label: '{{ item.path | basename }}'
      when: (item.path | basename) not in linux_router_eval_expected_names.split()
      delegate_to: localhost
  rescue:
    - name: Report which phase failed
      ansible.builtin.fail:
        msg: >-
          linux_router_eval: phase '{{ linux_router_eval_task }}' failed at task
          '{{ ansible_failed_task.name | default('unknown') }}':
          {{ ansible_failed_result.msg | default('see the task output above') }}
