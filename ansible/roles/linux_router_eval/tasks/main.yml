---
# linux_router_eval role
# Implements the linux-router evaluation tasks from plans/infrastructure-router-vlans-2.md
# VLAN data consumed from group_vars/all/vlan-vars.yml (source of truth)

- name: 'Research — clone linux-router upstream repository'
  ansible.builtin.include_tasks: research.yml
  when: linux_router_eval_task == 'research'

- name: 'Provision — install and configure linux-router on lab node'
  ansible.builtin.include_tasks: provision.yml
  when: linux_router_eval_task == 'provision'

- name: 'Validate — check NAT, DHCP option 6, and Pi-hole reachability'
  ansible.builtin.include_tasks: validate.yml
  when: linux_router_eval_task == 'validate'

- name: 'Full matrix — validate all 11 VLANs'
  ansible.builtin.include_tasks: full_matrix.yml
  when: linux_router_eval_task == 'full_matrix'

- name: 'Generate config — emit prototype scripts for all VLANs'
  ansible.builtin.include_tasks: generate_config.yml
  when: linux_router_eval_task == 'generate_config'
