---
- name: Create prototype output directory
  ansible.builtin.file:
    path: '{{ playbook_dir }}/../../projects/route-pi-squared/infrastructure/opnsense-vm/prototypes'
    state: directory
    mode: '0755'
  delegate_to: localhost

- name: Export OPNsense configuration backup via API
  ansible.builtin.uri:
    url: 'https://{{ opnsense_vm_eval_mgmt_ip }}/api/core/backup/download/this'
    method: GET
    user: '{{ opnsense_vm_eval_api_key }}'
    password: '{{ opnsense_vm_eval_api_secret }}'
    force_basic_auth: true
    # checkov:skip=CKV_ANSIBLE_1: verification defaults to true; the variable is an explicit opt-out for self-signed certs
    validate_certs: '{{ opnsense_vm_eval_validate_certs }}'
    return_content: true
    status_code: 200
  register: opnsense_vm_eval_config_backup

- name: Save OPNsense XML config backup
  ansible.builtin.copy:
    dest: '{{ playbook_dir }}/../../projects/route-pi-squared/infrastructure/opnsense-vm/prototypes/config-backup.xml'
    content: '{{ opnsense_vm_eval_config_backup.content }}'
    mode: '0600'
  delegate_to: localhost

- name: Copy Proxmox VM provisioning script
  ansible.builtin.copy:
    src: proxmox-create-opnsense-vm.sh
    dest: '{{ playbook_dir }}/../../projects/route-pi-squared/infrastructure/opnsense-vm/prototypes/proxmox-create-vm.sh'
    mode: '0755'
  delegate_to: localhost

- name: Render Proxmox VM parameters from template
  ansible.builtin.template:
    src: opnsense-vm.env.j2
    dest: '{{ playbook_dir }}/../../projects/route-pi-squared/infrastructure/opnsense-vm/prototypes/opnsense-vm.env'
    mode: '0644'
  delegate_to: localhost
