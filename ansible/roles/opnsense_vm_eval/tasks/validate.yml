---
- name: Retrieve VLAN interface list from OPNsense API
  ansible.builtin.uri:
    url: 'https://{{ opnsense_vm_eval_mgmt_ip }}/api/interfaces/vlan/searchItem'
    method: GET
    user: '{{ opnsense_vm_eval_api_key }}'
    password: '{{ opnsense_vm_eval_api_secret }}'
    force_basic_auth: true
    # checkov:skip=CKV_ANSIBLE_1: verification defaults to true; the variable is an explicit opt-out for self-signed certs
    validate_certs: '{{ opnsense_vm_eval_validate_certs }}'
    status_code: 200
  register: opnsense_vm_eval_vlan_list

- name: Verify evaluation VLANs (20 and 40) are present in OPNsense
  ansible.builtin.assert:
    that:
      - opnsense_vm_eval_vlan_list.json.rows | selectattr('tag', 'equalto', item.id | string) | list | length > 0
    fail_msg: 'VLAN {{ item.id }} ({{ item.name }}) not found in OPNsense VLAN list'
    success_msg: 'VLAN {{ item.id }} ({{ item.name }}) confirmed in OPNsense'
  loop: "{{ vlans | selectattr('id', 'in', [20, 40]) | list }}"
  loop_control:
    label: 'VLAN {{ item.id }}'

- name: Test Pi-hole DNS reachability through OPNsense
  ansible.builtin.uri:
    url: 'https://{{ opnsense_vm_eval_mgmt_ip }}/api/diagnostics/dns/reverse/{{ pihole_primary_vip }}'
    method: GET
    user: '{{ opnsense_vm_eval_api_key }}'
    password: '{{ opnsense_vm_eval_api_secret }}'
    force_basic_auth: true
    # checkov:skip=CKV_ANSIBLE_1: verification defaults to true; the variable is an explicit opt-out for self-signed certs
    validate_certs: '{{ opnsense_vm_eval_validate_certs }}'
    status_code: 200
  register: opnsense_vm_eval_dns_reach_check

- name: Test Pi-hole secondary DNS reachability through OPNsense
  ansible.builtin.uri:
    url: 'https://{{ opnsense_vm_eval_mgmt_ip }}/api/diagnostics/dns/reverse/{{ pihole_secondary_vip }}'
    method: GET
    user: '{{ opnsense_vm_eval_api_key }}'
    password: '{{ opnsense_vm_eval_api_secret }}'
    force_basic_auth: true
    # checkov:skip=CKV_ANSIBLE_1: verification defaults to true; the variable is an explicit opt-out for self-signed certs
    validate_certs: '{{ opnsense_vm_eval_validate_certs }}'
    status_code: 200
  register: opnsense_vm_eval_dns_secondary_reach_check

- name: Create research output directory
  ansible.builtin.file:
    path: '{{ opnsense_vm_eval_research_output_dir }}'
    state: directory
    mode: '0755'
  delegate_to: localhost

- name: Write validation results to research file
  ansible.builtin.copy:
    dest: '{{ opnsense_vm_eval_research_output_dir }}/opnsense-vm-capabilities.md'
    mode: '0644'
    content: |
      # OPNsense VM Capabilities Research

      **VM:** {{ opnsense_vm_eval_vm_name }} (VMID {{ opnsense_vm_eval_vm_id }}) on CrimsonRogue
      **Management IP:** {{ opnsense_vm_eval_mgmt_ip }}
      **Validated by:** ansible/roles/opnsense_vm_eval (validate task)
      **Date:** {{ ansible_date_time.date }}

      ## VLAN Validation Results (VLANs 20 and 40)

      - VLAN presence check: completed
      - Pi-hole DNS reachability ({{ pihole_primary_vip }}): {{ 'PASS' if opnsense_vm_eval_dns_reach_check.status == 200 else 'FAIL' }}
      - Pi-hole secondary DNS reachability ({{ pihole_secondary_vip }}): {{ 'PASS' if opnsense_vm_eval_dns_secondary_reach_check.status == 200 else 'FAIL' }}

      ## Full Matrix Results

      _To be populated during full-matrix task._
  delegate_to: localhost
