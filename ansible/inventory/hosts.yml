---
# Ansible inventory for the linux-router and OpenWrt-in-Docker evaluation
# Source of truth: docs/physical-hosts.md, docs/dhcp-scopes.md
# Management addresses prefer the InfraCore (VLAN 40) subnet: 10.76.40.0/24;
# exceptions are documented per host where they differ.

all:
  children:
    # --- Physical hypervisors & bare-metal hosts ---
    physical_hosts:
      hosts:
        CrimsonRogue:
          ansible_host: 10.76.40.10
          ansible_user: ansible
          role: ProxmoxNode1
          description: Primary Proxmox hypervisor; provides VLAN trunk and LXC/VM resources for evaluation containers
        AzureDefiant:
          ansible_host: 10.76.40.12
          ansible_user: ansible
          role: ProxmoxNode3
          description: Proxmox hypervisor; currently hosts K3s/Docker workloads and is the primary target for OpenWrt-in-Docker evaluation
        AmberNomad:
          ansible_host: 10.76.40.11
          ansible_user: ansible
          role: ProxmoxNode2
          pve_version: "9.1"
          os: debian13
          description: Proxmox VE 9.1 (Debian 13) hypervisor; management is pinned to InfraCore (10.76.40.0/24)

    # --- Lab router under test ---
    lab_router:
      hosts:
        radxa-a5e-lab:
          ansible_host: 10.76.40.5
          ansible_user: ansible
          description: Radxa Cubie A5E router test node (dual 2.5GbE NICs; WAN=end0, LAN=end1)
          wan_interface: end0
          lan_interface: end1

    # --- Docker/container host for OpenWrt evaluation ---
    lab_docker:
      hosts:
        AzureDefiant:
          ansible_host: 10.76.40.12
          ansible_user: ansible

    # --- OPNsense VM evaluation target ---
    # The VM is provisioned on CrimsonRogue (Proxmox) by the evaluate-opnsense-vm.yml playbook.
    # ansible_host must match opnsense_mgmt_ip in roles/opnsense-vm-eval/defaults/main.yml.
    lab_opnsense_vm:
      hosts:
        opnsense-eval:
          ansible_host: 10.76.40.20
          ansible_user: root
          ansible_connection: local
          description: OPNsense evaluation VM (VMID 200) running on CrimsonRogue; managed via REST API

    # --- DNS/DHCP reference service ---
    dns_servers:
      hosts:
        pihole-primary:
          ansible_host: 10.76.50.10
          ansible_user: ansible
          description: Pi-hole primary instance (GemenonServiceVault VLAN 50); used to validate DHCP option 6 delivery

    thefuck_hosts:
      children:
        physical_hosts: {}
        lab_router: {}
        dns_servers: {}
