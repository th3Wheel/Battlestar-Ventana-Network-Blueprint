---
# Ansible inventory for the linux-router and OpenWrt-in-Docker evaluation
# Source of truth: docs/physical-hosts.md, docs/dhcp-scopes.md
# All management addresses use the InfraCore (VLAN 40) subnet: 10.76.40.0/24

all:
  children:

    # --- Physical hypervisors & bare-metal hosts ---
    physical_hosts:
      hosts:
        CrimsonRogue:
          ansible_host: 10.76.40.10
          ansible_user: ansible
          role: ProxmoxNode1
          description: Primary Proxmox hypervisor; provides VLAN trunk and LXC/VM resources for evaluation containers
        MintRedoubt:
          ansible_host: 10.76.40.11
          ansible_user: ansible
          role: ESXiNode1
          description: Secondary hypervisor; fallback environment for OpenWrt Docker evaluation if AzureDefiant is constrained
        AzureDefiant:
          ansible_host: 10.76.40.12
          ansible_user: ansible
          role: K3sNode1
          description: K3s/Docker host; primary target for OpenWrt-in-Docker container evaluation

    # --- Lab router under test ---
    lab_router:
      hosts:
        radxa-a5e-lab:
          ansible_host: 10.76.40.5
          ansible_user: ansible
          description: Radxa Cubie A5E router test node (dual 2.5GbE NICs; WAN=end0, LAN=end1)
          wan_interface: end0
          lan_interface: end1

    # --- Docker/container host for OpenWrt evaluation ---
    lab_docker:
      hosts:
        AzureDefiant:
          ansible_host: 10.76.40.12
          ansible_user: ansible

    # --- DNS/DHCP reference service ---
    dns_servers:
      hosts:
        pihole-primary:
          ansible_host: 10.76.50.10
          ansible_user: ansible
          description: Pi-hole primary instance (GemenonServiceVault VLAN 50); used to validate DHCP option 6 delivery
