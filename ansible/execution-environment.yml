# yaml-language-server: $schema=
---
version: 3

images:
  base_image:
    # Keep in step with EE_BASE_IMAGE in Containerfile. ansible-core 2.21 needs Python 3.12 or newer.
    name: 'docker.io/library/python:3.13-slim'

dependencies:
  python: requirements.txt
  galaxy: collections/requirements.yml

options:
  package_manager_path: /usr/bin/apt-get
