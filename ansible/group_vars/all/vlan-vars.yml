# Hypervisor management addressing source of truth.
# This captures the legacy-to-target conversion used for Proxmox/QEMU nodes.
hypervisor_management:
  conversion_ratio:
    formula: "10.10.5.X -> 10.76.40.X"
    legacy_subnet: "10.10.5.0/24"
    target_subnet: "10.76.40.0/24"
    target_vlan_id: 40
    preserve_host_octet: false
    notes:
      - "VLAN 5 does not exist in the 10.76 design; all hypervisor management moves to VLAN 40."
      - "Where conflicts or reservations exist, inventory-assigned target IPs are authoritative."

  nodes:
    - hostname: CrimsonRogue
      platform: "proxmox-qemu"
      role: ProxmoxNode1
      mgmt_ip_legacy: "10.10.5.10"
      mgmt_ip_target: "10.76.40.10"
      mgmt_bridge: vmbr0
      mgmt_vlan_id: 40
      conversion_status: converted

    - hostname: AmberNomad
      platform: "proxmox-qemu"
      role: ProxmoxNode2
      mgmt_ip_legacy: "10.10.5.5"
      mgmt_ip_target: "10.76.40.11"
      mgmt_bridge: vmbr0
      mgmt_vlan_id: 40
      mgmt_mac: "00:23:24:f1:00:96"
      conversion_status: converted

    - hostname: AzureDefiant
      platform: "proxmox-qemu"
      role: ProxmoxNode3
      mgmt_ip_legacy: "10.10.5.6"
      mgmt_ip_target: "10.76.40.12"
      mgmt_bridge: vmbr0
      mgmt_vlan_id: 40
      mgmt_mac: "40:8d:5c:f6:1e:ef"
      conversion_status: converted
      conversion_note: "Target IP follows canonical inventory reservation."

# Network discovery integration settings.
# Keep secrets out of git; provide API key through vault/CI vars.
network_discovery:
  fing_local_api:
    enabled: true
    source: fing
    base_url: "http://10.10.0.136:49090/1"
    devices_endpoint: "/devices"
    people_endpoint: "/people"
    auth_query_param: auth
    api_key: "{{ vault_fing_local_api_key | default('') }}"
    timeout_seconds: 10
    poll_interval_seconds: 60
