    dhcp_range_end: "10.76.40.99"
    lease_time: "7d"
    dns: "{{ pihole_primary_vip }}"
    dns_secondary: "{{ pihole_secondary_vip }}"
    dhcp_enabled: true
    internet_access: blocked

  - id: 50
    name: GemenonServiceVault
    ssid: "GemenonVault"
    purpose: "NAS, MQTT, Home Assistant"
    subnet: "10.76.50.0/24"
    gateway: "10.76.50.1"
    dhcp_range_start: ""
    dhcp_range_end: ""
    lease_time: ""
    dns: ""
    dns_secondary: ""
