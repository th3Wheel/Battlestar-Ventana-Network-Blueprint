    purpose: "Media and Casting"
    subnet: "10.76.70.0/24"
    gateway: "10.76.70.1"
    dhcp_range_start: "10.76.70.100"
    dhcp_range_end: "10.76.70.199"
    lease_time: "24h"
    dns: "{{ pihole_primary_vip }}"
