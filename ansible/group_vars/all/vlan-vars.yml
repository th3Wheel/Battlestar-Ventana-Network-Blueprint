---
# VLAN catalogue sourced from:
#   docs/dhcp-scopes.md    — subnets, gateways, DHCP ranges, lease times
#   docs/naming-conventions.md — canonical SSID/VLAN names
#   docs/firewall-matrix.md    — internet access policy
#
# This file is the single Ansible source of truth for VLAN data.
# All playbooks and roles must reference these variables rather than
# hard-coding any IP addresses or VLAN IDs.

# Pi-hole DNS server (GemenonServiceVault, VLAN 50)
pihole_primary_vip: "10.76.50.10"
pihole_secondary_vip: "10.76.50.11"

# Full VLAN catalogue for the Battlestar Ventana network
vlans:
  - id: 10
    name: BattlestarVentana
    ssid: "Battlestar Ventana"
    purpose: "Trusted LAN"
    subnet: "10.76.10.0/24"
    gateway: "10.76.10.1"
    dhcp_range_start: "10.76.10.100"
    dhcp_range_end: "10.76.10.199"
    lease_time: "24h"
    dns: "{{ pihole_primary_vip }}"
    dns_secondary: "{{ pihole_secondary_vip }}"
    dhcp_enabled: true
    internet_access: unrestricted

  - id: 20
    name: CylonSynthLink
    ssid: "CylonSynthLink"
    purpose: "IoT devices"
    subnet: "10.76.20.0/24"
    gateway: "10.76.20.1"
    dhcp_range_start: "10.76.20.100"
    dhcp_range_end: "10.76.20.199"
    lease_time: 7d
    dns: "{{ pihole_primary_vip }}"
    dns_secondary: "{{ pihole_secondary_vip }}"
    dhcp_enabled: true
    internet_access: limited such that devices can access cloud services but not internal resources, throttled to 2Mbps

  - id: 30
    name: CapricaGuestPortal
    ssid: "CapricaGuestPortal"
    purpose: "Guest — Internet only"
    subnet: "10.76.30.0/24"
    gateway: "10.76.30.1"
    dhcp_range_start: "10.76.30.100"
    dhcp_range_end: "10.76.30.199"
    lease_time: "2h"
    dns: "{{ pihole_primary_vip }}"
    dns_secondary: "{{ pihole_secondary_vip }}"
    dhcp_enabled: true
    internet_access: unrestricted, but blocked from internal resources and throttled to 5Mbps

  - id: 31
    name: CapricaResidentPortal
    ssid: "CapricaResidentPortal"
    purpose: "Trusted Guest (casting, printing)"
    subnet: "10.76.31.0/24"
    gateway: "10.76.31.1"
    dhcp_range_start: "10.76.31.100"
    dhcp_range_end: "10.76.31.199"
    lease_time: "4h"
    dns: "{{ pihole_primary_vip }}"
    dns_secondary: "{{ pihole_secondary_vip }}"
    dhcp_enabled: true
    internet_access: unrestricted, but blocked from internal resources except media players etc, throttled to 10Mbps, mac address whitelist required for access

  - id: 40
    name: BasestarVentana
    ssid: "Basestar Ventana"
    purpose: "Infrastructure switches and controllers"
