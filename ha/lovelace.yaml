# 💠 BSG Network Dashboard (Home Assistant Lovelace)
# Requires sensors named sensor.vlanXX_metric
# Uses Mushroom cards for conditional color feedback

title: 💠 BSG Network Dashboard
views:
  - title: Overview
    cards:
      - type: custom:mushroom-template-card
        primary: Trusted (10)
        secondary: >
          Bandwidth: {{ states('sensor.vlan10_bandwidth_mbps') }} Mbps ·
          Failed logins/min: {{ states('sensor.vlan10_failed_logins_min') }}
        icon: mdi:shield-check
        icon_color: >
          {% set fails = states('sensor.vlan10_failed_logins_min')|float(0) %}
          {% if fails > 5 %} red
          {% elif fails > 2 %} yellow
          {% else %} green
          {% endif %}
      - type: custom:mushroom-template-card
        primary: IoT (20)
        secondary: >
          Devices up: {{ states('sensor.vlan20_devices_up') }} ·
          >3σ: {{ states('sensor.vlan20_sigma_anomalies') }}
        icon: mdi:cog
        icon_color: >
          {% if states('sensor.vlan20_sigma_anomalies')|int(0) >= 3 %} red
          {% elif states('sensor.vlan20_sigma_anomalies')|int(0) >= 1 %} yellow
          {% else %} green
          {% endif %}
      # … repeat for VLANs 30, 31, 40, 50, 60, 70, 81, 82, 90 …