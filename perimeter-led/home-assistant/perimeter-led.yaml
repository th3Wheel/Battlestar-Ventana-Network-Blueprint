perimeter_led:
  homeassistant:
    customize:
      light.perimeter_led:
        friendly_name: "Perimeter LED"
        room: "Main Bedroom"
        icon: mdi:led-strip-variant

  light:
    - platform: wled
      host: 10.10.3.16
      name: perimeter_led

  script:
    perimeter_led_all_white:
      alias: "Perimeter LED – All White"
      sequence:
        - service: select.select_option
          target:
            entity_id: select.wled_preset
          data:
            option: "All White"

    perimeter_led_mirror_sides:
      alias: "Perimeter LED – Mirror Sides"
      sequence:
        - service: select.select_option
          target:
            entity_id: select.wled_preset
          data:
            option: "Mirror Sides"

    perimeter_led_top_focus:
      alias: "Perimeter LED – Top Focus"
      sequence:
        - service: select.select_option
          target:
            entity_id: select.wled_preset
          data:
            option: "Top Focus (23u)"

    perimeter_led_mid_only:
      alias: "Perimeter LED – Mid Only"
      sequence:
        - service: select.select_option
          target:
            entity_id: select.wled_preset
          data:
            option: "Mid Only (14u/10u)"

    perimeter_led_bottom_accent:
      alias: "Perimeter LED – Bottom Accent"
      sequence:
        - service: select.select_option
          target:
            entity_id: select.wled_preset
          data:
            option: "Bottom Accent (8u/12u)"

  automation:
    - alias: "Perimeter LED – Turn On at Sunset"
      trigger:
        - platform: sun
          event: sunset
      action:
        - service: script.perimeter_led_bottom_accent

    - alias: "Perimeter LED – Turn Off at Midnight"
      trigger:
        - platform: time
          at: "00:00:00"
      action:
        - service: light.turn_off
          entity_id: light.perimeter_led