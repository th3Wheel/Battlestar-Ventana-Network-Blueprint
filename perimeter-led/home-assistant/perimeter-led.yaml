perimeter_led:
  homeassistant:
    customize:
      light.perimeter_led:
        friendly_name: "Perimeter LED"
        room: "Main Bedroom"
        icon: mdi:led-strip-variant

  light:
    - platform: wled
      host: 10.10.3.16
      name: perimeter_led

  script:
    perimeter_led_all_white:
      alias: "Perimeter LED – All White"
      sequence:
        - service: wled.preset
          data:
            preset: 1
            entity_id: light.perimeter_led

    perimeter_led_mirror_sides:
      alias: "Perimeter LED – Mirror Sides"
      sequence:
        - service: wled.preset
          data:
            preset: 2
            entity_id: light.perimeter_led

    perimeter_led_top_focus:
      alias: "Perimeter LED – Top Focus"
      sequence:
        - service: wled.preset
          data:
            preset: 3
            entity_id: light.perimeter_led

    perimeter_led_mid_only:
      alias: "Perimeter LED – Mid Only"
      sequence:
        - service: wled.preset
          data:
            preset: 4
            entity_id: light.perimeter_led

    perimeter_led_bottom_accent:
      alias: "Perimeter LED – Bottom Accent"
      sequence:
        - service: wled.preset
          data:
            preset: 5
            entity_id: light.perimeter_led

  automation:
    - alias: "Perimeter LED – Turn On at Sunset"
      trigger:
        - platform: sun
          event: sunset
      action:
        - service: script.perimeter_led_bottom_accent

    - alias: "Perimeter LED – Turn Off at Midnight"
      trigger:
        - platform: time
          at: "00:00:00"
      action:
        - service: light.turn_off
          entity_id: light.perimeter_led