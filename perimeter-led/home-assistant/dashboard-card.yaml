type: vertical-stack
cards:
  - type: heading
    heading: Perimeter LED
    heading_style: title

  - type: light
    entity: light.perimeter_led
    name: Main Bedroom Perimeter

  - type: grid
    columns: 2
    square: false
    cards:
      - type: button
        name: All White
        icon: mdi:white-balance-sunny
        tap_action:
          action: call-service
          service: wled.preset
          data:
            preset: 1
            entity_id: light.perimeter_led

      - type: button
        name: Mirror Sides
        icon: mdi:mirror-rectangle
        tap_action:
          action: call-service
          service: wled.preset
          data:
            preset: 2
            entity_id: light.perimeter_led

      - type: button
        name: Top Focus
        icon: mdi:arrow-up-bold
        tap_action:
          action: call-service
          service: wled.preset
          data:
            preset: 3
            entity_id: light.perimeter_led

      - type: button
        name: Mid Only
        icon: mdi:arrow-expand-vertical
        tap_action:
          action: call-service
          service: wled.preset
          data:
            preset: 4
            entity_id: light.perimeter_led

      - type: button
        name: Bottom Accent
        icon: mdi:arrow-down-bold
        tap_action:
          action: call-service
          service: wled.preset
          data:
            preset: 5
            entity_id: light.perimeter_led