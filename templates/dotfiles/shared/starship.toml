"$schema" = 'https://starship.rs/config-schema.json'

palette = 'tokyo_night_exact'

# Tokyo Night rounded blocks on line 1, shell + prompt on line 2.
format = """
[░▒▓](fg:tnfg)\
$os$username$hostname[](fg:tnfg bg:tnblue)\
$directory\
$git_branch$git_state$git_status$nodejs$python$rust$golang$php\
[](fg:tnblack)\
$fill\
([](fg:tnbg)$cmd_duration[](fg:tnbg) )\
([](fg:tnbg)$memory_usage[](fg:tnbg) )\
([](fg:tnbg)$battery${custom.battery_cells_win}${custom.battery_cells_linux} )\
([](fg:tnbg)$time[](fg:tnbg) )
[░▒▓](fg:tnfg)\
[](fg:tnfg bg:tnsel)\
$shell[ ](fg:tnsel)$character"""

right_format = ""

add_newline     = true
scan_timeout    = 90
command_timeout = 3000

[palettes.tokyo_night_exact]
tnfg = '#a9b1dc'
tnfghi = '#c0caf5'
tnbg = '#1a1b2c'
tnsel = '#28344a'
tnblack = '#414868'
tncomment = '#565f89'
tnred = '#f7768e'
tnorange = '#ff9e64'
tnyellow = '#e0af68'
tngreen = '#73daca'
tncyan = '#7dcfff'
tnblue = '#7aa2f7'
tnmagenta = '#bb9af7'

[fill]
symbol = " "
style = "none"

[character]
success_symbol = "[❯](bold fg:tnfg)"
error_symbol = "[✕](bold fg:tnred)"
vimcmd_symbol = "[❮](bold fg:tnyellow)"

[cmd_duration]
style = "bold fg:tnyellow bg:tnbg"
min_time = 3000
format = "[ ⏱ $duration ]($style)"

[git_state]
format = '[ $state( $progress_current/$progress_total) ](fg:tnyellow bg:tnblack)'

[git_status]
style = "fg:tnblue bg:tnblack"
ahead = "⇡${count}"
behind = "⇣${count}"
diverged = "⇕⇡${ahead_count}⇣${behind_count}"
staged = "[+$count](fg:tngreen bg:tnblack)"
modified = "[!$count](fg:tnyellow bg:tnblack)"
untracked = "[?$count](fg:tncyan bg:tnblack)"
deleted = "[-$count](fg:tnred bg:tnblack)"
renamed = "[»$count](fg:tnmagenta bg:tnblack)"
format = '[ $all_status$ahead_behind ]($style)'

[battery]
full_symbol = "󰁹 "
charging_symbol = "󰂄 "
discharging_symbol = "󰁼 "
unknown_symbol = "󰁽 "
empty_symbol = "󰂎 "
format = "[ $symbol$percentage ]($style)"

[[battery.display]]
threshold = 99
style = "bold fg:tnfg bg:tnbg"

[custom.battery_cells_win]
os = "windows"
shell = ["pwsh", "-NoProfile", "-Command", "-"]
command = '''
$batteryInfo = Get-CimInstance Win32_Battery -ErrorAction SilentlyContinue |
    Select-Object -First 1 EstimatedChargeRemaining, BatteryStatus
if ($null -eq $batteryInfo) { exit 0 }
$battery = [int]$batteryInfo.EstimatedChargeRemaining
if ($battery -ge 100) { exit 0 }
$fullSlots = [Math]::Floor($battery / 10)
$partialStep = $battery % 10
$trackRgb = @(40, 52, 74)
$fillRgb = @(122, 162, 247)

function New-BgCode([int[]]$rgb) {
    "48;2;$($rgb[0]);$($rgb[1]);$($rgb[2])"
}

function New-FgCode([int[]]$rgb) {
    "38;2;$($rgb[0]);$($rgb[1]);$($rgb[2])"
}

function Blend-Rgb([int[]]$from, [int[]]$to, [int]$step) {
    if ($step -le 0) { return $from }
    if ($step -ge 10) { return $to }
    @(
        [int][Math]::Round($from[0] + (($to[0] - $from[0]) * ($step / 10.0))),
        [int][Math]::Round($from[1] + (($to[1] - $from[1]) * ($step / 10.0))),
        [int][Math]::Round($from[2] + (($to[2] - $from[2]) * ($step / 10.0)))
    )
}

$cellColors = for ($index = 1; $index -le 10; $index++) {
    if ($index -le $fullSlots) {
        $fillRgb
    } elseif (($partialStep -gt 0) -and ($index -eq ($fullSlots + 1))) {
        Blend-Rgb $trackRgb $fillRgb $partialStep
    } else {
        $trackRgb
    }
}

$esc = [char]27
$cells = -join ($cellColors | ForEach-Object { "$esc[$(New-BgCode $_)m " })
$rightFg = New-FgCode $cellColors[-1]
"$cells$esc[$rightFg" + "m$esc[0m"
'''
format = '$output'
unsafe_no_escape = true
ignore_timeout = true

[custom.battery_cells_linux]
os = "linux"
shell = ["sh"]
command = '''
battery=$(cat /sys/class/power_supply/BAT*/capacity 2>/dev/null | head -n 1)
[ -n "$battery" ] || exit 0
[ "$battery" -ge 100 ] && exit 0

full_slots=$(( battery / 10 ))
partial_step=$(( battery % 10 ))
esc=$(printf '\033')
track_r=40
track_g=52
track_b=74
fill_r=122
fill_g=162
fill_b=247

blend_channel() {
    start=$1
    end=$2
    step=$3
    echo $(( start + (((end - start) * step + 5) / 10) ))
}

partial_r=$(blend_channel "$track_r" "$fill_r" "$partial_step")
partial_g=$(blend_channel "$track_g" "$fill_g" "$partial_step")
partial_b=$(blend_channel "$track_b" "$fill_b" "$partial_step")

i=1
last_bg="48;2;$track_r;$track_g;$track_b"
while [ "$i" -le 10 ]; do
    if [ "$i" -le "$full_slots" ]; then
        bg="48;2;$fill_r;$fill_g;$fill_b"
    elif [ "$partial_step" -gt 0 ] && [ "$i" -eq $((full_slots + 1)) ]; then
        bg="48;2;$partial_r;$partial_g;$partial_b"
    else
        bg="48;2;$track_r;$track_g;$track_b"
    fi
    last_bg="$bg"
    printf '%s[%sm ' "$esc" "$bg"
    i=$((i + 1))
done

right_fg="38;2;${last_bg#48;2;}"
printf '%s[%sm%s[0m' "$esc" "$right_fg" "$esc"
'''
format = '$output'
unsafe_no_escape = true
ignore_timeout = true

