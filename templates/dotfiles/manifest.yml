# Dotfile manifest — maps source templates to their target paths on the workstation.
# target_windows: path using %WINENV% variables (expanded at deploy time via cmd.exe in WSL)
#
# Deploy with:
#   bash scripts/deploy-dotfiles.sh --dry-run   # preview
#   bash scripts/deploy-dotfiles.sh             # apply

dotfiles:
  - id: windows-terminal
    description: 'Windows Terminal Preview settings'
    source: windows-terminal/settings.json
    target_windows: "%LOCALAPPDATA%\\Packages\\Microsoft.WindowsTerminalPreview_8wekyb3d8bbwe\\LocalState\\settings.json"

  - id: powershell-core-profile
    description: 'PowerShell Core (pwsh) CurrentUserCurrentHost profile — Starship, VS Code shell integration, PowerToys CommandNotFound, thefuck'
    source: powershell/pwsh/Microsoft.PowerShell_profile.ps1
    target_windows: "%USERPROFILE%\\Documents\\PowerShell\\Microsoft.PowerShell_profile.ps1"

  - id: powershell-5-profile
    description: 'Windows PowerShell 5.1 CurrentUserCurrentHost profile — Chocolatey tab-completion, thefuck'
    source: powershell/windows/Microsoft.PowerShell_profile.ps1
    target_windows: "%USERPROFILE%\\Documents\\WindowsPowerShell\\Microsoft.PowerShell_profile.ps1"

  - id: wsl-bashrc
    description: 'WSL Bash profile — PATH fix for ~/.local/bin, thefuck alias init'
    source: bash/.bashrc
    target_wsl: '~/.bashrc'

  - id: wsl-zshrc
    description: 'WSL Zsh profile — PATH fix for ~/.local/bin, thefuck alias init'
    source: bash/.zshrc
    target_wsl: '~/.zshrc'

  - id: linux-bashrc
    description: 'Linux (bare metal / LXC / VM) Bash profile — PATH fix for ~/.local/bin, thefuck alias init'
    source: bash/.bashrc
    target_linux: '~/.bashrc'

  - id: linux-zshrc
    description: 'Linux (bare metal / LXC / VM) Zsh profile — PATH fix for ~/.local/bin, thefuck alias init'
    source: bash/.zshrc
    target_linux: '~/.zshrc'
