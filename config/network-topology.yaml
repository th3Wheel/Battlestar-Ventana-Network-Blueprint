# network-topology.yaml
# Machine-readable network topology — Battlestar Ventana Network
#
# Source of truth for:
#   - VLAN subnet assignments (canonical)
#   - Hypervisor / physical node management IPs
#   - Pi-hole HA VIP addresses
#   - DNS naming scheme
#
# Referenced by: /.github/copilot-instructions.md (Determinism Rules, primary source)
# Fallback for: docs/ip-allocation.md (static device assignments)
#
# Subnet scheme: 10.76.<VLAN_ID>.0/24
# DNS scheme:    <service>.<zone>.ventana.internal
#
# IMPORTANT: Host-level IP assignments (cameras, services, VMs) are tracked in:
#   - docs/host-tracker.md        (general static assignments)
#   - docs/device-inventory.md    (IoT/sensor devices)
# Those files are authoritative for individual device IPs.

network:
  domain: 'ventana.internal'
  subnet_scheme: '10.76.<VLAN_ID>.0/24'
  vlan_registry: 'config/vlan-registry.yaml'

# ─── Infrastructure VIPs and Reserved Addresses ──────────────────────────────

services:
  pihole:
    primary_vip: '10.76.50.10'
    secondary_vip: '10.76.50.11'
    vlan: 50
    dns_record: 'pihole.services.ventana.internal'
    notes: 'Floating VIPs managed by keepalived VRRP. See ADR-005.'

  dns_upstream:
    description: 'Unbound recursive resolver, co-located with Pi-hole nodes'
    port: 5335
    bound_to: loopback

# ─── Hypervisor Management Nodes (VLAN 40 — BasestarVentana) ─────────────────

hypervisors:
  addressing_note: >
    Legacy management was on 10.10.5.0/24. All hypervisor management IPs
    have migrated to 10.76.40.0/24 (VLAN 40 — BasestarVentana).
    Host octet is NOT preserved from legacy; see per-node mgmt_ip_target.

  nodes:
    - hostname: CrimsonRogue
      platform: proxmox-qemu
      role: ProxmoxNode1
      mgmt_ip: '10.76.40.10'
      mgmt_vlan: 40
      mgmt_bridge: vmbr0
      legacy_ip: '10.10.5.10'
      conversion_status: converted
      dns_record: 'crimsonrogue.infra.ventana.internal'

    - hostname: AmberNomad
      platform: proxmox-qemu
      role: ProxmoxNode2
      mgmt_ip: '10.76.40.11'
      mgmt_vlan: 40
      mgmt_bridge: vmbr0
      mgmt_mac: '00:23:24:f1:00:96'
      legacy_ip: '10.10.5.5'
      conversion_status: converted
      dns_record: 'ambernomad.infra.ventana.internal'

    - hostname: AzureDefiant
      platform: proxmox-qemu
      role: ProxmoxNode3
      mgmt_ip: '10.76.40.12'
      mgmt_vlan: 40
      mgmt_bridge: vmbr0
      mgmt_mac: '40:8d:5c:f6:1e:ef'
      legacy_ip: '10.10.5.6'
      conversion_status: converted
      dns_record: 'azuredefiant.infra.ventana.internal'

