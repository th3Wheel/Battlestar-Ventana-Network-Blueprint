# dns-conventions.yaml
# Machine-readable mirror of the DNS naming scheme.
# Canonical human-readable definition: /docs/naming-conventions.md § DNS Record Naming
# Referenced by: /.github/copilot-instructions.md (Determinism Rules table)
#
# Update policy: any change here MUST be reflected in /docs/naming-conventions.md
# and the Determinism Rules table in /.github/copilot-instructions.md.

dns_naming_scheme:
  pattern: '<service>.<zone>.ventana.internal'
  fixed_suffix: 'ventana.internal'
  description: >
    All internal DNS records follow the pattern <service>.<zone>.ventana.internal.
    All components are lowercase. The fixed suffix must never be omitted or changed.

  components:
    service:
      description: Lowercase service or host identifier
      examples:
        - pihole
        - proxmox
        - homeassistant
        - grafana
      rules:
        - Must be lowercase
        - Must match the primary service identifier in /docs/services.md where applicable
    zone:
      description: Lowercase VLAN zone token
      rules:
        - Must be lowercase
        - Must be drawn from the canonical zone_tokens list below; do not invent new tokens

  zone_tokens:
    - token: trusted
      vlan_name: BattlestarVentana
      vlan_id: 10
    - token: iot
      vlan_name: CylonSynthLink
      vlan_id: 20
    - token: guest
      vlan_name: CapricaGuestPortal
      vlan_id: 30
    - token: elevated
      vlan_name: CapricaResidentPortal
      vlan_id: 31
    - token: infra
      vlan_name: BasestarVentana
      vlan_id: 40
    - token: services
      vlan_name: GemenonServiceVault
      vlan_id: 50
    - token: print
      vlan_name: VirgonFleetYard
      vlan_id: 60
    - token: media
      vlan_name: PegasusMediaNode
      vlan_id: 70
    - token: cam
      vlan_name: ScorpiaMediaShield / ScorpiaMediaRelay
      vlan_id: '81 / 82'
    - token: work
      vlan_name: ScyllaProcessControl
      vlan_id: 90

  examples:
    - record: pihole.services.ventana.internal
      service: Pi-hole DNS/DHCP server
      vlan: services (50)
    - record: proxmox.infra.ventana.internal
      service: Proxmox hypervisor
      vlan: infra (40)
    - record: homeassistant.services.ventana.internal
      service: Home Assistant
      vlan: services (50)
    - record: grafana.services.ventana.internal
      service: Grafana dashboard
      vlan: services (50)
