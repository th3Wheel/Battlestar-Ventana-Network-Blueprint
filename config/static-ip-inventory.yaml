# Temporary canonical static-address inventory.
#
# This file records current and target assignments during migration. It is
# intended for later export to the authoritative inventory service.

inventory:
  version: 1
  status: transitional
  addresses:
    - hostname: pihole-service
      address: 10.76.50.10
      vlan_id: 50
      address_type: virtual_service
      service: pihole
      migration_status: target
      notes: Floating Pi-hole service address managed by HA failover.

    - hostname: pihole-node-01
      address: 10.76.50.15
      vlan_id: 50
      address_type: physical_node
      service: pihole
      migration_status: target

    - hostname: pihole-node-02
      address: 10.76.50.12
      vlan_id: 50
      address_type: physical_node
      service: pihole
      migration_status: target

    - hostname: pihole-node-03
      address: 10.76.50.13
      vlan_id: 50
      address_type: physical_node
      service: pihole
      migration_status: target

    - hostname: pihole-node-04
      address: 10.76.50.14
      vlan_id: 50
      address_type: physical_node
      service: pihole
      migration_status: target

    - hostname: servervault-mqtt
      address: 10.76.50.25
      vlan_id: 50
      address_type: static_service
      service: mqtt
      migration_status: target

    - hostname: servervault-hyperion
      address: 10.76.50.20
      vlan_id: 50
      address_type: static_service
      service: hyperion
      migration_status: target

  reserved_ranges:
    - vlan_id: 40
      start: 10.76.40.10
      end: 10.76.40.99
      purpose: infrastructure management and static nodes
    - vlan_id: 50
      start: 10.76.50.10
      end: 10.76.50.99
      purpose: service addresses and static hosts
