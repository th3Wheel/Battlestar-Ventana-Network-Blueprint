---
# Don't report passed checks in output (super-linter default)
quiet: true

skip-check:
  # Every 'block:' in ansible/roles/*/tasks/main.yml only selects one evaluation phase via
  # 'when: <role>_task == ...'; none is error handling, so a 'rescue' would be meaningless.
  # Inline '# checkov:skip' comments are not honoured for this graph-based check, so it is
  # skipped here. Blocks that do need error handling should still add a rescue.
  - CKV2_ANSIBLE_3
