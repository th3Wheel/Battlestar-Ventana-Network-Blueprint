# Prometheus Alert Rules - TorBox Companion
# Monitors service health, latency, restarts, and API error rates
# Place this file in /etc/prometheus/rules/ and reference in prometheus.yml

groups:
  - name: torbox_companion_alerts
    interval: 30s
    rules:
      # Alert: Service Down
      # Triggers when the TorBox Companion service is unreachable
      # SLO: 99.5% availability (max downtime ~22 minutes/month)
      - alert: TorBoxCompanionServiceDown
        expr: up{job="torbox-companion"} == 0
        for: 2m
        labels:
          severity: critical
          service: torbox-companion
          slo: availability
        annotations:
          summary: "TorBox Companion service is down"
          description: "The TorBox Companion service at {{ $labels.instance }} has been unreachable for more than 2 minutes. Current status: DOWN"
          runbook_url: "https://github.com/th3Wheel/Battlestar-Ventana-Network-Blueprint/blob/main/Blueprints/Services/TorBoxCompanion/MONITORING-TORBOX-COMPANION.md#service-down"
          action: "Check service status: systemctl status torbox-companion"

      # Alert: High Latency
      # Triggers when p95 response time exceeds SLO threshold
      # SLO: p95 < 500ms
      - alert: TorBoxCompanionHighLatency
        expr: histogram_quantile(0.95, rate(http_request_duration_seconds_bucket{job="torbox-companion"}[5m])) > 0.5
        for: 5m
        labels:
          severity: warning
          service: torbox-companion
          slo: latency
        annotations:
          summary: "TorBox Companion experiencing high latency"
          description: "p95 latency for TorBox Companion is {{ $value | humanizeDuration }}. Threshold: 500ms. This may impact user experience."
          runbook_url: "https://github.com/th3Wheel/Battlestar-Ventana-Network-Blueprint/blob/main/Blueprints/Services/TorBoxCompanion/MONITORING-TORBOX-COMPANION.md#high-latency"
          action: "Check container resources: docker stats torbox-companion"

      # Alert: Restart Loop
      # Triggers when container restarts multiple times within a short period
      # SLO: RTO < 5 minutes
      - alert: TorBoxCompanionRestartLoop
        expr: rate(container_start_time_seconds{name="torbox-companion"}[10m]) > 0.1
        for: 5m
        labels:
          severity: critical
          service: torbox-companion
          slo: stability
        annotations:
          summary: "TorBox Companion is in a restart loop"
          description: "The TorBox Companion container has restarted {{ $value | humanize }} times in the last 10 minutes. This indicates a critical failure."
          runbook_url: "https://github.com/th3Wheel/Battlestar-Ventana-Network-Blueprint/blob/main/Blueprints/Services/TorBoxCompanion/MONITORING-TORBOX-COMPANION.md#restart-loop"
          action: "Check logs: docker compose logs -f torbox-companion"

      # Alert: API Error Rate High
      # Triggers when the HTTP error rate (5xx) exceeds threshold
      # SLO: < 1% error rate
      - alert: TorBoxCompanionAPIErrorRateHigh
        expr: |
          (
            sum(rate(http_requests_total{job="torbox-companion",status=~"5.."}[5m]))
            /
            sum(rate(http_requests_total{job="torbox-companion"}[5m]))
          ) > 0.01
        for: 5m
        labels:
          severity: warning
          service: torbox-companion
          slo: reliability
        annotations:
          summary: "TorBox Companion API error rate is high"
          description: "API error rate is {{ $value | humanizePercentage }}. Threshold: 1%. Users may be experiencing failures when interacting with TorBox API."
          runbook_url: "https://github.com/th3Wheel/Battlestar-Ventana-Network-Blueprint/blob/main/Blueprints/Services/TorBoxCompanion/MONITORING-TORBOX-COMPANION.md#api-errors"
          action: "Check application logs and TorBox API status"

      # Alert: Container Memory High
      # Triggers when container memory usage exceeds 80% of limit
      - alert: TorBoxCompanionMemoryHigh
        expr: |
          (
            container_memory_usage_bytes{name="torbox-companion"}
            /
            container_spec_memory_limit_bytes{name="torbox-companion"}
          ) > 0.8
        for: 5m
        labels:
          severity: warning
          service: torbox-companion
          resource: memory
        annotations:
          summary: "TorBox Companion memory usage is high"
          description: "Container memory usage is {{ $value | humanizePercentage }} of limit (512M). Consider investigating memory leaks or increasing limits."
          action: "Check memory stats: docker stats torbox-companion"

      # Alert: Container CPU High
      # Triggers when container CPU usage is consistently high
      - alert: TorBoxCompanionCPUHigh
        expr: rate(container_cpu_usage_seconds_total{name="torbox-companion"}[5m]) > 0.8
        for: 10m
        labels:
          severity: warning
          service: torbox-companion
          resource: cpu
        annotations:
          summary: "TorBox Companion CPU usage is high"
          description: "Container CPU usage is {{ $value | humanize }} cores. Limit: 1.0 core. Performance may be degraded."
          action: "Check CPU stats: docker stats torbox-companion"

# Integration with Alertmanager:
# 1. Add this file to prometheus.yml:
#    rule_files:
#      - /etc/prometheus/rules/torbox-companion-alerts.yml
# 2. Reload Prometheus configuration:
