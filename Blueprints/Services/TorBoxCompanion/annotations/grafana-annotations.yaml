# Grafana Annotation Stream Configuration - TorBox Companion
# Annotates deploys, restarts, and systemd events on Grafana dashboards
# Accepts webhook POSTs from GitHub Actions and systemd journal

# Annotation API endpoint configuration
# POST to: http://grafana-host:3000/api/annotations
# Authentication: API Token required (set in Grafana)

---
# Example annotation payload for GitHub Actions deployment
# Use this structure in your CI/CD pipeline
deployment_annotation:
  dashboardUID: torbox-companion
  panelId: null # null = all panels
  time: '{{ .Timestamp }}' # Unix timestamp in milliseconds
  timeEnd: '{{ .TimestampEnd }}' # Optional: end time for range annotation
  tags:
    - deployment
    - torbox-companion
    - automated
  text: |
    🚀 Deployment: {{ .Version }}
    Branch: {{ .Branch }}
    Commit: {{ .CommitSHA }}
    Triggered by: {{ .Actor }}

# Example annotation payload for container restart
# Can be triggered by a monitoring script or systemd hook
restart_annotation:
  dashboardUID: torbox-companion
  panelId: null
  time: '{{ .Timestamp }}'
  tags:
    - restart
    - torbox-companion
    - systemd
  text: |
    🔄 Container Restart
    Previous uptime: {{ .Uptime }}
    Restart reason: {{ .Reason }}
    Exit code: {{ .ExitCode }}

# Example annotation payload for systemd service state change
# Hook into systemd journal with a monitoring script
systemd_event_annotation:
  dashboardUID: torbox-companion
  panelId: null
  time: '{{ .Timestamp }}'
  tags:
    - systemd
    - torbox-companion
    - '{{ .EventType }}'
  text: |
    ⚙️ systemd Event: {{ .EventType }}
    Service: torbox-companion.service
    Status: {{ .Status }}
    Message: {{ .Message }}

