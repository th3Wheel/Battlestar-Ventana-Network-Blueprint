---
# API Token Setup in Grafana
# 1. Navigate to Configuration → API Keys
# 2. Create new key with "Editor" role
# 3. Store in GitHub Secrets as GRAFANA_API_KEY
# 4. Store Grafana URL as GRAFANA_URL

---
# Querying annotations via API
# GET http://grafana-host:3000/api/annotations?dashboardUID=torbox-companion&limit=100
# Returns all annotations for TorBox Companion dashboard

---
# Best practices:
# - Use consistent tag naming: [event-type, service-name, source]
# - Include timestamps in milliseconds (Unix epoch * 1000)
# - Keep annotation text concise but informative
# - Use emojis for visual scanning: 🚀 deploy, 🔄 restart, ⚠️ warning, ❌ failure
# - Include links to logs, commits, or runbooks when applicable
