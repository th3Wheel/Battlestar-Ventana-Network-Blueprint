[project]
name = "battlestar-ventana-network-blueprint"
version = "0.1.0"
description = "Battlestar Ventana network architecture, automation, and policy blueprint"
readme = "README.md"
authors = [
    { name = "th3wheel", email = "tnwheeler@gmail.com" }
]
requires-python = ">=3.15"
dependencies = []

[dependency-groups]
dev = [
    "djlint==1.36.4",
    "pyyaml==6.0.3",
    "ruff==0.14.11",
    "ty==0.0.78",
    "yamllint==1.37.1",
    "uv_build>=0.12.10,<0.13.0"
]

[project.scripts]
battlestar-ventana-network-blueprint = "battlestar_ventana_network_blueprint:main"

[build-system]
requires = ["uv_build>=0.12.10,<0.13.0"]
build-backend = "uv_build"

[tool.uv.extra-build-variables]
pyyaml = { PYYAML_FORCE_LIBYAML = "0" }

[tool.ruff]
line-length = 120
target-version = "py315"
extend-exclude = [
    ".venv*",
    "node_modules",
    "ha/templates",
]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.ty.environment]
python-version = "3.15"

[tool.ty.src]
include = [
    "src",
    "scripts",
]
exclude = [
    "ha/templates",
]
