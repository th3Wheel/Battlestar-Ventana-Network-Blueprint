[project]
name = "battlestar-ventana-network-blueprint"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "th3wheel", email = "tnwheeler@gmail.com" }
]
requires-python = ">=3.14"
dependencies = []

[dependency-groups]
dev = [
    "black==25.12.0",
    "isort==7.0.0",
    "pylint==4.0.4",
    "pyyaml==6.0.3",
    "ruff==0.14.11",
    "ty==0.0.78",
]

[project.scripts]
battlestar-ventana-network-blueprint = "battlestar_ventana_network_blueprint:main"

[build-system]
requires = ["uv_build>=0.12.10,<0.13.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 120
target-version = "py314"
extend-exclude = [
    ".venv",
    "node_modules",
    "ha/templates",
]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.ty.environment]
python-version = "3.14"

[tool.ty.src]
include = [
    "src",
    "scripts",
]
exclude = [
    "ha/templates",
]
