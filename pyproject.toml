[project]
name = "battlestar-ventana-network-blueprint"
version = "0.1.0"
description = "Battlestar Ventana network architecture, automation, and policy blueprint"
readme = "readme.md"
authors = [
    { name = "th3wheel", email = "tnwheeler@gmail.com" }
]
requires-python = ">=3.14"
dependencies = []

[dependency-groups]
dev = [
    "pyyaml==6.0.3",
    "ruff==0.14.11",
    "ty==0.0.78",
]

[project.scripts]
battlestar-ventana-network-blueprint = "battlestar_ventana_network_blueprint:main"

[build-system]
requires = ["uv_build>=0.12.10,<0.13.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 120
target-version = "py314"
extend-exclude = [
    ".venv",
    "node_modules",
    "ansible/collections",
    "ha/templates",
]

[tool.ruff.lint]
# Ruff replaces Black (format), isort (I) and Pylint (PL, A001/A002 for redefined-builtin).
select = ["E", "F", "I", "UP", "B", "PL", "A001", "A002"]
# Pylint's too-many-arguments, disabled in the former .pylintrc.
ignore = ["PLR0913"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.ty.environment]
python-version = "3.14"

[tool.ty.src]
include = [
    "src",
    "scripts",
    ".agents/skills/poka-yoke/scripts",
    ".github/skills/led-analysis/lint",
]
exclude = [
    "ha/templates",
]
