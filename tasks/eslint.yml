# yaml-language-server: $schema=https://taskfile.dev/schema.json
version: '3'

tasks:
  fix-md:
    desc: Automatically fix linting issues in all Markdown files with ESLint
    cmds:
      - npm run lint:md -- --fix
  lint-md:
    desc: Lint all Markdown files with ESLint
    cmds:
      - npm run lint:md
  lint-all:
    desc: Lint all files with ESLint
    cmds:
      - npm run lint:all
  fix-all:
    desc: Automatically fix linting issues in all files with ESLint
    cmds:
      - npm run lint:all -- --fix
  lint:
    desc: Lint this file with ESLint
    cmds:
      - eslint

  lint-js:
    desc: Lint all JavaScript files with ESLint
    cmds:
      - npm run lint:js
  fix-js:
    desc: Automatically fix linting issues in all JavaScript files with ESLint
    cmds:
      - npm run lint:js -- --fix
