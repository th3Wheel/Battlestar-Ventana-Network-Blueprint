# yaml-language-server: $schema=https://taskfile.dev/schema.json
version: '3'

tasks:
  bootstrap-dry-run:
    desc: Preview isolated Linux/WSL controller synchronization
    platforms: [linux]
    cmds:
      - uv sync --project ansible/controller --locked --dry-run

  bootstrap:
    desc: Synchronize isolated Linux/WSL Ansible controller
    platforms: [linux]
    cmds:
      - uv sync --project ansible/controller --locked
      - uv run --project ansible/controller --locked ansible-galaxy collection install -r ansible/collections/requirements.yml

  smoke-test:
    desc: Smoke-test router evaluation playbooks (--check)
    platforms: [linux]
    cmds:
      - uv run --project ansible/controller --locked ansible-playbook
        ansible/playbooks/evaluate-linux-router.yml
        ansible/playbooks/evaluate-openwrt-docker.yml
        ansible/playbooks/evaluate-opnsense-vm.yml
        --check

  deploy-pihole-ha-check:
    desc: Deploy Pi-hole Keepalived HA (--check)
    platforms: [linux]
    cmds:
      - uv run --project ansible/controller --locked ansible-playbook ansible/playbooks/deploy-pihole-keepalived-ha.yml --check

  deploy-pihole-ha:
    desc: Deploy Pi-hole Keepalived HA
    platforms: [linux]
    cmds:
      - uv run --project ansible/controller --locked ansible-playbook ansible/playbooks/deploy-pihole-keepalived-ha.yml
