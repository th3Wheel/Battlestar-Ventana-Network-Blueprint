# Core network infrastructure services — ServerVault (VLAN 50: 10.76.50.0/24)
#
# Provides the reverse proxy (Traefik) and syslog collector that underpin all
# other services running on ServerVault.
#
# Source-of-truth references for all IPs and ports used in this file:
#   ansible/group_vars/all/vlan-vars.yml  — VLAN 50 subnet/gateway
#   docs/dhcp-scopes.md                   — VLAN 50 subnet/gateway
#   docs/services.md (VLAN 50 row)        — HTTP/HTTPS 80/443, Syslog 514
#   docs/firewall-matrix.md               — Service/Ports Reference Table
#
# Prerequisites:
#   - Docker Engine 24.0+ and Docker Compose v2.0+
#   - External macvlan network "vlan50" created on the host:
#       docker network create -d macvlan \
#         --subnet=10.76.50.0/24 \
#         --gateway=10.76.50.1 \
#         -o parent=eth0.50 vlan50
#     Subnet and gateway sourced from: ansible/group_vars/all/vlan-vars.yml (id: 50)

services:
  traefik:
    image: traefik:v3.3
    container_name: traefik
    restart: unless-stopped
    command:
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      # Port 80 sourced from: docs/services.md (VLAN 50: HTTP/HTTPS 80/443)
      - "--entrypoints.web.address=:80"
      # Port 443 sourced from: docs/services.md (VLAN 50: HTTP/HTTPS 80/443)
      - "--entrypoints.websecure.address=:443"
      - "--api.dashboard=false"
      - "--log.level=INFO"
      - "--accesslog=true"
    ports:
      # HTTP: docs/services.md (VLAN 50 row) and docs/firewall-matrix.md Service/Ports Reference
      - "80:80"
      # HTTPS: docs/services.md (VLAN 50 row) and docs/firewall-matrix.md Service/Ports Reference
      - "443:443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - traefik-certs:/certs
    networks:
      - vlan50
    healthcheck:
      test: ["CMD", "traefik", "healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 3

  syslog:
    image: balabit/syslog-ng:4.11.0
    container_name: syslog-ng
    restart: unless-stopped
    ports:
      # Syslog UDP/TCP 514: docs/services.md (VLAN 50: Syslog 514) and
      # docs/firewall-matrix.md (81/82 Cameras → ServerVault: Syslog 514)
      - "514:514/udp"
      - "514:514/tcp"
    volumes:
      - syslog-data:/var/log/syslog-ng
    networks:
      - vlan50
    healthcheck:
      test: ["CMD", "syslog-ng-ctl", "stats"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  traefik-certs:
  syslog-data:

networks:
  vlan50:
    external: true
