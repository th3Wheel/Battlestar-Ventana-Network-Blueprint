# Pi-hole + Unbound DNS stack — ServerVault (VLAN 50: 10.76.50.0/24)
#
# Pi-hole provides network-wide ad blocking and local DNS resolution.
# Unbound provides a local recursive DNS resolver with DNSSEC validation,
# used as Pi-hole's upstream to eliminate reliance on third-party DNS providers.
#
# Source-of-truth references for all IPs and ports used in this file:
#   ansible/group_vars/all/vlan-vars.yml  — pihole_primary_ip, VLAN 50 subnet/gateway
#   docs/dhcp-scopes.md                   — VLAN 50 subnet/gateway
#   docs/services.md (VLAN 50 row)        — DNS 53, HTTP/HTTPS 80/443
#   docs/firewall-matrix.md               — Service/Ports Reference Table
#
# Prerequisites:
#   - Docker Engine 24.0+ and Docker Compose v2.0+
#   - External macvlan network "vlan50" created on the host:
#       docker network create -d macvlan \
#         --subnet=10.76.50.0/24 \
#         --gateway=10.76.50.1 \
#         -o parent=eth0.50 vlan50
#     Subnet and gateway sourced from: ansible/group_vars/all/vlan-vars.yml (id: 50)
#   - Persistent data directories:
#       sudo mkdir -p /srv/pihole/{pihole,dnsmasq,unbound}
#       sudo chown -R root:root /srv/pihole
#   - The Unbound config mounted at /srv/pihole/unbound/unbound.conf MUST include:
#       interface: 0.0.0.0@5335
#     so that Pi-hole can reach Unbound at 172.20.0.2#5335 (PIHOLE_DNS_ below).
#
# Environment variables required at runtime (set in a .env file or secret manager):
#   PIHOLE_WEBPASSWORD — admin web UI password (stack will refuse to start if unset)

services:
  unbound:
    image: mvance/unbound:1.22.0
    container_name: unbound
    restart: unless-stopped
    volumes:
      - /srv/pihole/unbound:/opt/unbound/etc/unbound:ro
    networks:
      pihole-internal:
        # Static IP on the stack-internal bridge; referenced by PIHOLE_DNS_ below.
        ipv4_address: 172.20.0.2
    healthcheck:
      test: ["CMD", "drill", "@127.0.0.1", "cloudflare.com"]
      interval: 30s
      timeout: 5s
      retries: 3

  pihole:
    image: pihole/pihole:2026.04.1
    container_name: pihole
    restart: unless-stopped
    depends_on:
      - unbound
    environment:
      TZ: "America/Chicago"
      # Stack refuses to start if PIHOLE_WEBPASSWORD is unset or empty.
      WEBPASSWORD: "${PIHOLE_WEBPASSWORD:?PIHOLE_WEBPASSWORD must be set in the environment}"
      # Upstream DNS: Unbound internal bridge IP, port 5335.
      # Port 5335: must match the interface directive in /srv/pihole/unbound/unbound.conf.
      PIHOLE_DNS_: "172.20.0.2#5335"
      DNSSEC: "true"
      DNSMASQ_LISTENING: "all"
    networks:
      vlan50:
        # Static IP sourced from: ansible/group_vars/all/vlan-vars.yml — pihole_primary_ip
        ipv4_address: 10.76.50.10
      pihole-internal: {}
    volumes:
      - /srv/pihole/pihole:/etc/pihole
      - /srv/pihole/dnsmasq:/etc/dnsmasq.d
    healthcheck:
      # Port 53 sourced from: docs/services.md (VLAN 50: DNS 53) and docs/firewall-matrix.md
      # Query against 127.0.0.1 — the local loopback is reachable from inside the container.
      test: ["CMD", "dig", "+short", "+norecurse", "+retry=0", "@127.0.0.1", "pi.hole"]
      interval: 30s
      timeout: 5s
      retries: 3

networks:
  vlan50:
    external: true
  pihole-internal:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/29
