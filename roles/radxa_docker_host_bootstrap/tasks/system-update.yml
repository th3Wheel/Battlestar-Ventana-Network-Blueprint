---
# System Update Tasks
# Handles package updates, firmware installation, and kernel upgrades

- name: Update package indexes
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 3600

- name: Upgrade all packages to latest versions
  ansible.builtin.apt:
    upgrade: dist
    autoremove: true
    autoclean: true

- name: Install Radxa firmware and kernel meta-packages
  ansible.builtin.apt:
    name:
      - linux-image-current-radxa-aarch64
      - linux-headers-current-radxa-aarch64
      - radxa-firmware
    state: present
    update_cache: true

- name: Check if reboot is required
  ansible.builtin.stat:
    path: /var/run/reboot-required
  register: reboot_required

- name: Reboot system if required
  ansible.builtin.reboot:
    msg: 'Rebooting system for kernel/firmware updates'
    pre_reboot_delay: 5
    post_reboot_delay: 30
  when: reboot_required.stat.exists
