---
- name: Install thefuck on Windows
  community.windows.win_pip:
    name: thefuck
    state: present

- name: Ensure PowerShell profile directories exist
  ansible.windows.win_file:
    path: '{{ item }}'
    state: directory
  loop:
    - "{{ ansible_env.USERPROFILE }}\\Documents\\PowerShell"
    - "{{ ansible_env.USERPROFILE }}\\Documents\\WindowsPowerShell"

- name: Configure thefuck in PowerShell Core profile
  ansible.windows.win_lineinfile:
    path: "{{ ansible_env.USERPROFILE }}\\Documents\\PowerShell\\Microsoft.PowerShell_profile.ps1"
    create: true
    line: 'if (Get-Command thefuck -ErrorAction SilentlyContinue) { Invoke-Expression "$(thefuck --alias {{ thefuck_alias }})" }'
    state: present

- name: Configure thefuck in Windows PowerShell 5.1 profile
  ansible.windows.win_lineinfile:
    path: "{{ ansible_env.USERPROFILE }}\\Documents\\WindowsPowerShell\\Microsoft.PowerShell_profile.ps1"
    create: true
    line: 'if (Get-Command thefuck -ErrorAction SilentlyContinue) { Invoke-Expression "$(thefuck --alias {{ thefuck_alias }})" }'
    state: present
