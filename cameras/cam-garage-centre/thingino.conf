# Deterministic Thingino provisioning template
# NOTE: This is for uEnv.txt or jct import workflows, NOT for fw_setenv
# For one-time provisioning after firmware update, use runonce.sh template instead

# Wi-Fi Configuration
wifi_ssid="op://homelab/Secureiotwifi/ssid"
wifi_password="op://homelab/Secureiotwifi/password"
wifi_mode=client

# Network Configuration
ip_mode=static
ip_address=10.10.3.53
netmask=255.255.255.0
gateway=10.10.0.1
dns=1.1.1.1

# Hostname
hostname=cam-garage-centre

# SSH & Security
ssh_enabled=1
ssh_port=22
root_password=op://homelab/CameraSSHPassword

# MQTT Integration (optional)
mqtt_enabled=0
mqtt_host=10.10.10.10
mqtt_port=1883
mqtt_user=camera
mqtt_pass=op://homelab/MQTTCameraPassword

# NTP Time Sync
ntp_enabled=1
ntp_server=10.10.10.10
