# To get started with Dependabot version updates, you'll need to specify which
# package ecosystems to update and where the package manifests are located.
# Please see the documentation for all configuration options:
# https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file

version: 2
updates:
  # Enable version updates for GitHub Actions
  - package-ecosystem: 'github-actions'
    # Location of workflow files to scan for GitHub Actions dependencies
    # Workflow files stored in the default location of `.github/workflows`
    directory: '/'
    # Check for updates once a week
    schedule:
      interval: 'weekly'

  # Enable version updates for GitHub Actions used in Ansible playbooks
 # - package-ecosystem: 'github-actions'
    # Location of Ansible playbooks to scan for GitHub Actions dependencies
 #   directory: '/ansible/'
    # Check for updates once a week
 #   schedule:
 #     interval: 'weekly'    
  - package-ecosystem: 'npm'
    # Location of package.json files to scan for npm dependencies
    directory: '/'
    # Check for updates once a week
    schedule:
      interval: 'weekly'
