name: Validate Camera Map

on:
  push:
    paths:
      - "templates/camera-map.yaml"
      - "scripts/**"
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Install yq
        run: sudo apt-get update && sudo apt-get install -y yq

      - name: Validate camera-map.yaml structure
        run: |
          yq e '.cameras[].id' templates/camera-map.yaml > /dev/null
          yq e '.cameras[].ip' templates/camera-map.yaml > /dev/null
          yq e '.cameras[].hostname' templates/camera-map.yaml > /dev/null

      - name: Check for duplicate IPs
        run: |
          ips=$(yq e '.cameras[].ip' templates/camera-map.yaml)
          if [ "$(echo "$ips" | sort | uniq -d)" != "" ]; then
            echo "Duplicate IPs detected"
            exit 1
          fi

      - name: Check for duplicate hostnames
        run: |
          hosts=$(yq e '.cameras[].hostname' templates/camera-map.yaml)
          if [ "$(echo "$hosts" | sort | uniq -d)" != "" ]; then
            echo "Duplicate hostnames detected"
            exit 1
          fi

      - name: Validation complete
        run: echo "camera-map.yaml validated successfully"
