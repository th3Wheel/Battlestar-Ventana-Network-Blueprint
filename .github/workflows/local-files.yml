name: Local files

# Blocks per-machine files (settings.local.json, *.local.*, secrets, keys) from reaching the
# default branch. The forbidden list is .github/local-files-policy.json; the checker is
# scripts/check-local-files.ts. Require the "Forbid local files" check in the branch ruleset.
#
# SECURITY: this runs on pull_request_target so that GitHub uses the BASE branch's copy of this
# workflow, the checker and the policy. A pull request therefore cannot edit them to pass its own
# check. That is only safe because nothing from the pull request is ever checked out or run:
#   - the checkout below is the base branch (the default for this trigger);
#   - the pull request's commits are fetched as data and read with `git ls-tree` / `git diff`;
#   - the token is read-only and no secrets are used.
# Do not add a step that checks out, builds or executes pull request code, and do not widen
# `permissions`. zizmor flags the trigger by design; the suppression below is deliberate.

on:
  pull_request_target: # zizmor: ignore[dangerous-triggers]
    branches: [master, main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  forbid-local-files:
    name: Forbid local files
    runs-on: ubuntu-latest
    steps:
      # For pull_request_target this is the base branch, not the pull request.
      - name: Checkout the base branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '26.10'

      # Fetch the pull request's commits without checking them out: they are only read as data.
      - name: Fetch the pull request commits
        if: github.event_name == 'pull_request_target'
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: git fetch --no-tags --quiet origin "refs/pull/${PR_NUMBER}/head:refs/remotes/pr/head"

      # Every file in the pull request's tree: a local file it adds, or one already in the tree,
      # fails the check.
      - name: No local files in the pull request
        if: github.event_name == 'pull_request_target'
        run: node scripts/check-local-files.ts --tracked --head refs/remotes/pr/head

      - name: No tracked local files
        if: github.event_name != 'pull_request_target'
        run: node scripts/check-local-files.ts --tracked
