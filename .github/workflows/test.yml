name: Test

on:
  push:
    branches: [master, main, 'integration/**']
  pull_request:
    branches: [master, main, 'integration/**']
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '26.10'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck and run tests
        run: npm test
