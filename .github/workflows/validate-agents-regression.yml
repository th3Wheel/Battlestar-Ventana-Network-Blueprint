name: Validate Agents Regression

on:
  pull_request:
    branches: [master, main, 'integration/**']
    paths:
      - '.github/agents/validate-agents.sh'
      - 'scripts/check-validator-line-endings.sh'
      - 'scripts/fixtures/agents/**'
  workflow_dispatch:

permissions:
  contents: read

# Cancel a run when a newer commit supersedes it on the same pull request or branch, including master and main.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate-agents-regression:
    name: Validate LF/CRLF regression checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Run validate-agents.sh line-ending regression script
        run: bash scripts/check-validator-line-endings.sh
