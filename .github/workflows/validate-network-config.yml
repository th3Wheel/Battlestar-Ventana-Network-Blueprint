name: Validate Network Config

on:
  push:
    paths:
      - 'config/vlan-registry.yaml'
      - 'config/static-ip-inventory.yaml'
      - 'scripts/validate_network_config.py'
      - '.github/workflows/validate-network-config.yml'
  pull_request:
    paths:
      - 'config/vlan-registry.yaml'
      - 'config/static-ip-inventory.yaml'
      - 'scripts/validate_network_config.py'
      - '.github/workflows/validate-network-config.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version-file: .python-version

      - name: Install PyYAML
        run: pip install PyYAML==6.0.3

      - name: Validate VLAN registry and static IP inventory
        run: python scripts/validate_network_config.py
