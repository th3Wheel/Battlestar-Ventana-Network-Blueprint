name: MCP Context7 Validation

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mcp-context7:
    runs-on: ubuntu-latest
    environment: copilot
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '26.10'

      - name: Validate Context7 MCP server
        env:
          CONTEXT7_API_KEY: ${{ secrets.COPILOT_MCP_CONTEXT7_KEY }}
        run: |
          npx -y @upstash/context7-mcp@2.2.1 --help

      # Add any real MCP tasks below, ensuring CONTEXT7_API_KEY is provided from the copilot environment secret

  mcp-config-guard:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '26.10'

      - name: Validate MCP config inventory and drift
        run: npm run mcp:guard
