name: MCP Context7

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  mcp-context7:
    runs-on: ubuntu-latest
    environment: copilot
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run Context7 MCP server help
        env:
          CONTEXT7_API_KEY: ${{ secrets.COPILOT_MCP_CONTEXT7_KEY }}
        run: |
          npx -y @context7/mcp-server --help || true

      # Add any real MCP tasks below, ensuring CONTEXT7_API_KEY is provided from the copilot environment secret
      - name: Placeholder MCP task
        env:
          CONTEXT7_API_KEY: ${{ secrets.COPILOT_MCP_CONTEXT7_KEY }}
        run: |
          echo "MCP Context7 ready. Add your commands here."
