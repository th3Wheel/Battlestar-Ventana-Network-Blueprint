# This workflow executes several linters on changed files based on languages used in your code base whenever
# you push a code or open a pull request.
#
# You can adjust the behavior by modifying this file.
# For more information, see:
# https://github.com/github/super-linter
name: Lint Code Base

on:
  push:
  pull_request:
    branches: ["master"]
jobs:
  run-lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          # Full git history is needed to get a proper list of changed files within `super-linter`
          fetch-depth: 0

      - name: Install Ansible
        run: python3 -m pip install ansible ansible-lint

      - name: Install Ansible collections
        run: ansible-galaxy collection install community.docker community.general community.kubernetes community.kubernetes.core community.kubernetes.hub community.kubernetes.helm community.kubernetes.helmhub community.kubernetes.openshift community.kubernetes.skopeo community.kubernetes.utils 1password.1password

      - name: Lint Code Base
        uses: github/super-linter@v4
        env:
          VALIDATE_ALL_CODEBASE: false
          DEFAULT_BRANCH: "master"
          LINTER_RULES_PATH: "."
          MARKDOWN_CONFIG_FILE: ".markdownlint.jsonc"
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
