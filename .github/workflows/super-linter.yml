# This workflow executes several linters on changed files based on languages used in your code base whenever
# you push a code or open a pull request.
#
# You can adjust the behavior by modifying this file.
# For more information, see:
# https://github.com/github/super-linter
name: Lint Code Base

on:
  push:
  pull_request:
    branches: ['master']
jobs:
  run-lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          # Full git history is needed to get a proper list of changed files within `super-linter`
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '26.10.0'
          cache: npm

      - name: Install Node.js dependencies
        run: npm ci

      - name: Lint Markdown with ESLint
        run: npm run lint:md

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version-file: '.python-version'

      - name: Install uv
        run: python -m pip install uv==0.13.1

      - name: Synchronize Python environment
        run: uv sync --locked

      - name: Synchronize isolated Ansible controller
        run: uv sync --project ansible/controller --locked

      - name: Verify Ansible controller
        run: |
          uv run --project ansible/controller --locked ansible --version
          uv run --project ansible/controller --locked ansible-lint --version
          uv run --project ansible/controller --locked molecule --version

      - name: Install Ansible collections
        run: ANSIBLE_CONFIG=ansible/ansible.cfg uv run --project ansible/controller --locked ansible-galaxy collection install -r ansible/collections/requirements.yml

      - name: Run Ruff
        run: uv run ruff check .

      - name: Run Ruff format check
        run: uv run ruff format --check .

      - name: Run ty
        run: uv run ty check

      - name: Lint Code Base
        uses: github/super-linter@v4
        env:
          VALIDATE_ALL_CODEBASE: false
          DEFAULT_BRANCH: 'master'
          LINTER_RULES_PATH: '.'
          VALIDATE_MARKDOWN: false
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
