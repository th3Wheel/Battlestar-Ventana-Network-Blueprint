# This workflow executes several linters on changed files based on languages used in your code base whenever
# you push a code or open a pull request.
#
# You can adjust the behavior by modifying this file.
# For more information, see:
# https://github.com/github/super-linter
name: Lint Code Base

on:
  push:
  pull_request:
    branches: ['master', 'integration/**']

# super-linter reports a commit status per language (MULTI_STATUS), which needs statuses: write.
permissions:
  contents: read
  packages: read
  statuses: write

# Cancel a run when a newer commit supersedes it on the same pull request or branch, including master and main.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  run-lint:
    runs-on: ubuntu-latest
    # One run per branch or pull request: a new push cancels that ref's older lint run, never another ref's. Runs on
    # master are not cancelled, so every merge keeps its own result.
    concurrency:
      group: lint-code-base-${{ github.ref }}
      cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}
    steps:
      # Install third-party code under the runner's temp dir, never in the checkout. super-linter's
      # container mounts it at /github/runner_temp, so ansible-lint can still find the collections.
      - name: Keep installed dependencies outside the checkout
        run: |
          echo "ANSIBLE_COLLECTIONS_PATH=$RUNNER_TEMP/ansible" >> "$GITHUB_ENV"
          echo "UV_PROJECT_ENVIRONMENT=$RUNNER_TEMP/venv" >> "$GITHUB_ENV"

      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # Full git history is needed to get a proper list of changed files within `super-linter`
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version-file: '.python-version'

      # The TypeScript ESLint run resolves imports such as `vitest` from the checkout's node_modules.
      # super-linter excludes node_modules from linting, so installing here does not add lint targets.
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26.10'

      - name: Install Node.js dependencies
        run: npm ci --ignore-scripts

      - name: Install Ansible
        run: python -m pip install -r ansible/requirements.txt ansible-lint

      - name: Install Ansible collections
        run: ansible-galaxy collection install -r ansible/collections/requirements.yml -p "$ANSIBLE_COLLECTIONS_PATH"

      - name: Install uv
        run: python -m pip install uv

      - name: Synchronize Python environment
        run: uv sync --locked

      - name: Run Ruff
        run: uv run ruff check .

      - name: Run Ruff format check
        run: uv run ruff format --check .

      - name: Run ty
        run: uv run ty check

      - name: Lint Code Base
        uses: super-linter/super-linter@2da136927bd4a73596db63044b504547c62cb854 # v9.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VALIDATE_ALL_CODEBASE: false
          DEFAULT_BRANCH: 'master'
          LINTER_RULES_PATH: '.'
          JAVASCRIPT_ES_CONFIG_FILE: 'eslint.config.js'
          MARKDOWN_CONFIG_FILE: '.markdownlint.jsonc'
          ANSIBLE_COLLECTIONS_PATH: /github/runner_temp/ansible
          # Shell scripts predate shfmt and use 2-space indentation; reformat repo-wide before re-enabling.
          VALIDATE_SHELL_SHFMT: false
          # Python is linted by the repository's own steps above: ruff check, ruff format --check and
          # ty check, with versions locked in uv.lock and configuration in pyproject.toml. super-linter's
          # copies run their own tool versions with default settings (for example ruff 0.16.x against the
          # locked 0.14.x), so they disagree with the repository's choices.
          VALIDATE_PYTHON_BLACK: false
          VALIDATE_PYTHON_FLAKE8: false
          VALIDATE_PYTHON_ISORT: false
          VALIDATE_PYTHON_MYPY: false
          VALIDATE_PYTHON_PYLINT: false
          VALIDATE_PYTHON_RUFF: false
          VALIDATE_PYTHON_RUFF_FORMAT: false
