# This workflow executes several linters on changed files based on languages used in your code base whenever
# you push a code or open a pull request.
#
# You can adjust the behavior by modifying this file.
# For more information, see:
# https://github.com/github/super-linter
name: Lint Code Base

on:
  push:
  pull_request:
    branches: ['master']

# super-linter reports a commit status per language (MULTI_STATUS), which needs statuses: write.
permissions:
  contents: read
  packages: read
  statuses: write

jobs:
  run-lint:
    runs-on: ubuntu-latest
    steps:
      # Install third-party code under the runner's temp dir, never in the checkout. super-linter's
      # container mounts it at /github/runner_temp, so ansible-lint can still find the collections.
      - name: Keep installed dependencies outside the checkout
        run: |
          echo "ANSIBLE_COLLECTIONS_PATH=$RUNNER_TEMP/ansible" >> "$GITHUB_ENV"
          echo "UV_PROJECT_ENVIRONMENT=$RUNNER_TEMP/venv" >> "$GITHUB_ENV"

      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # Full git history is needed to get a proper list of changed files within `super-linter`
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version-file: '.python-version'

      - name: Install Ansible
        run: python -m pip install -r ansible/requirements.txt ansible-lint

      - name: Install Ansible collections
        run: ansible-galaxy collection install -r ansible/collections/requirements.yml -p "$ANSIBLE_COLLECTIONS_PATH"

      - name: Install uv
        run: python -m pip install uv

      - name: Synchronize Python environment
        run: uv sync --locked

      - name: Run Ruff
        run: uv run ruff check .

      - name: Run Ruff format check
        run: uv run ruff format --check .

      - name: Run ty
        run: uv run ty check

      - name: Lint Code Base
        uses: super-linter/super-linter@2da136927bd4a73596db63044b504547c62cb854 # v9.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VALIDATE_ALL_CODEBASE: false
          DEFAULT_BRANCH: 'master'
          LINTER_RULES_PATH: '.'
          JAVASCRIPT_ES_CONFIG_FILE: 'eslint.config.js'
          MARKDOWN_CONFIG_FILE: '.markdownlint.jsonc'
          ANSIBLE_COLLECTIONS_PATH: /github/runner_temp/ansible
          # Shell scripts predate shfmt and use 2-space indentation; reformat repo-wide before re-enabling.
          VALIDATE_SHELL_SHFMT: false
