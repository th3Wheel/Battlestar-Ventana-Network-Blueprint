---
- name: Secure SSH key bootstrap using 1Password
  hosts: new_hosts
  gather_facts: false

  vars:
    # Retrieve the SSH password from 1Password
    ssh_password: >-
      {{ lookup(
          'community.general.onepassword',
          'SSH Password',
          field='password'
      ) }}

    # Path to the public key on the controller
    public_key_path: '~/.ssh/id_ed25519.pub'

  tasks:
    - name: Validate 1Password item exists
      ansible.builtin.assert:
        that:
          - ssh_password is defined
          - ssh_password | length > 0
        fail_msg: >
          1Password lookup failed. Ensure a 'SSH Password' item exists in your 1Password vault
          with a 'password' field containing the SSH password for target hosts.
        success_msg: 'Successfully retrieved SSH password from 1Password'
      delegate_to: localhost

    - name: Ensure known_hosts contains the target host key
      ansible.builtin.known_hosts:
        name: '{{ inventory_hostname }}'
        key: "{{ lookup('pipe', 'ssh-keyscan -t ed25519 ' ~ inventory_hostname) }}"
      delegate_to: localhost

    - name: Copy SSH key using password from 1Password
      ansible.builtin.expect:
        command: >
          ssh-copy-id -i {{ public_key_path }} {{ ansible_user }}@{{ inventory_hostname }}
        responses:
          '(?i)password': '{{ ssh_password }}'
      delegate_to: localhost

    - name: Validate passwordless SSH now works
      ansible.builtin.command: 'true'
      register: ssh_check
      changed_when: false

    - name: Report success
      debug:
        msg: 'SSH key successfully deployed to {{ inventory_hostname }}'
